<!DOCTYPE html>
<html>
	<head>
		<title>
			linkedin-responsive-website
		</title>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
		<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
		<style>
			*{
				padding:0;
				margin:0;
			}
			body{
				background-color: rgb(147, 168, 168);
				font-family:Arial ,sans sarif;
			}
			a{
				text-decoration: none;				
			}			
			header{
				display:flex;
				align-items:center;
				justify-content: space-between;
				padding:0.1rem 4.8rem;
				background:white;
			}
			header > div{
				display:flex;
				align-items:center;
				justify-content:center;			
				width:29%;
			}
			.fa-linkedin{
				color:blue;	
				font-size: 2.5rem;				
			}
			header > a{
				
				font-size:1.9rem;
				color:white;
				font-weight:bold;
				padding:0rem 0.3rem;
				border-radius:3px;
			}
			.input_box
			{
				background:white;
				margin-left:0.5rem;
				border-radius:20px;
				padding-left:0.45rem;
				display:flex;
				align-items:center;
				width:100%;
				border:1px solid gray;
			}
			header input{
				outline:none;
				padding:.6rem 0.2rem;
				border:none;
				border-radius:20px;
				width:100%;
			}
			.input_box:hover{
				background-color: rgba(147, 168, 168, .9);
			}
			header input:hover{
				background-color: rgba(147, 168, 168, .9);
			}	
			nav{
				display:flex;
				gap:1px;
			}
			.boxes{
				display: flex;
				align-items:center;
				justify-content:center;
				flex-direction: column;
				padding:0.1rem 0.85rem;
				font-size:0.85rem;
			}
			.home-font{
				font-size:1.5rem;
			}
			.logo
			{
				border-radius:50%;
				height:25px;
				width:28px;
			}			
		</style>
	</head>
	
	<body>
		<header>
			<div class="">
				<i class="fa-brands fa-linkedin"></i>
				<div class="input_box"><i class="ri-search-line"></i><input type="text" placeholder="Search"></div>
			</div>
			<nav>
				<a href="#" class="boxes">
					<span class="home-font"><i class="ri-home-5-fill"></i></span>
					<span>Home</span>
				</a>
				<a href="#"class="boxes">
					<span class="home-font"><i class="ri-group-line"></i></i></span>
					<span>Network</span>
				</a>
				<a href="#" class="boxes">
					<span class="home-font"><i class="ri-mail-open-line"></i></span>
					<span>Jobs</span>
				</a>
				<a href="#" class="boxes">
					<span class="home-font"><i class="ri-message-3-line"></i></span>
					<span class="content-font">Message</span>
				</a>
				<a href="#" class="boxes">
					<span class="home-font"><i class="ri-notification-3-line"></i></span>
					<span>Notifaction</span>
				</a>
				<a href="#" class="boxes">
					<img class="logo" src="https://yt3.ggpht.com/yti/ANjgQV-nwZirt5-Hn5oOMmOU9uOA8t3wg8_bgBEhOC6K7V_Rhw=s88-c-k-c0x00ffffff-no-rj-mo">
					<span>Me<i class="ri-arrow-down-s-fill"></i></span>
				</a>
				<a href="#" class="boxes">
					<span class="home-font"><i class="ri-menu-line"></i></span>
					<span>For Business</span>
				</a>
				<a href="#" class="boxes">
					<span class="home-font"><i class="ri-focus-2-line"></i></span>
					<span>Advertise</span>
				</a>
			</nav>
		</header>
	</body>
</html>
