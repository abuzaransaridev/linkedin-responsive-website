<!DOCTYPE html>
<html>
	<head>
		<title>
			linkedin-responsive-website
		</title>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
		<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
		<style>
			*{
				padding:0;
				margin:0;
			}
			body{
				background-color: rgb(147, 168, 168);
				font-family:Arial ,sans sarif;
			}
			a{
				text-decoration: none;				
			}			
			header{
				display:flex;
				align-items:center;
				justify-content: space-between;
				padding:0.4rem 4.8rem;
				background:green;
			}
			header div{
				display:flex;
				align-items:center;
				justify-content:center;			
				width:29%;
				background:red;
			}
			.fa-linkedin{
				color:blue;	
				font-size: 2.5rem;				
			}
			header a{
				
				font-size:1.9rem;
				background:blue;
				color:white;
				font-weight:bold;
				padding:0rem 0.3rem;
				border-radius:3px;
			}
			.input_box
			{
				background:white;
				margin-left:0.5rem;
				border-radius:20px;
				padding-left:0.45rem;
				display:flex;
				align-items:center;
				width:100%;
			}
			header input{
				outline:none;
				padding:.6rem 0.2rem;
				border:none;
				border-radius:20px;
				width:100%;
			}
			.input_box:hover{
				background-color: rgba(147, 168, 168, .9);
			}
			header input:hover{
				background-color: rgba(147, 168, 168, .9);
			}	
			nav{
				display:grid;
				grid-template-columns:repeat(8,1fr);
				background:yellow;	
			}
			.boxes{
				display: flex;
				flex-direction: column;
				align-items: center;
				padding:0.1rem 1rem;
			}
			.home-font{
				font-size:2rem;
			}
		</style>
	</head>
	
	<body>
		<header>
			<div class="">
				<i class="fa-brands fa-linkedin"></i>
				<div class="input_box"><i class="ri-search-line"></i><input type="text" placeholder="Search"></div>
			</div>
			<nav>
				<div class="boxes">
					<span class="home-font"><i class="ri-home-5-fill"></i></span>
					<span>Home</span>
				</div>
				<div class="boxes">
					<span class="home-font"><i class="ri-group-line"></i></i></span>
					<span>Network</span>
				</div>
				<div class="boxes">
					
				</div>
				<div class="boxes">
					
				</div>
				<div class="boxes">
					
				</div>
				<div class="boxes">
					
				</div>
				<div class="boxes">
					
				</div>
				<div class="boxes">
					
				</div>
			</nav>
		</header>
	</body>
</html>
